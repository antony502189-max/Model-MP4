services:
  api:
    image: model-mp4:local
    build: &app-build
      context: .
      extra_hosts:
        - "pypi.org:151.101.0.223"
        - "files.pythonhosted.org:151.101.0.223"
        - "download.pytorch.org:3.164.230.12"
        # PyTorch's wheel index redirects here in some regions. Docker Desktop
        # on this machine does not resolve that hostname reliably.
        - "download-r2.pytorch.org:3.164.230.12"
        - "download.openmmlab.com:163.181.254.181"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &app-env
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/app.db
      REDIS_URL: redis://redis:6379/0
      DETECTOR_BACKEND: ${DETECTOR_BACKEND:-mmdet}
      MMDET_CONFIG: /app/mmdet_configs/rtmdet_tiny_bag.py
      MMDET_CHECKPOINT: /models/rtmdet_bag.pth
      DEVICE: ${DEVICE:-cpu}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.35}
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - ./data:/data
      - ./models:/models
      - ./dataset:/dataset
      - ./work_dirs:/work_dirs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: model-mp4:local
    command: celery -A worker.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    environment: *app-env
    volumes:
      - ./data:/data
      - ./models:/models
      - ./dataset:/dataset
      - ./work_dirs:/work_dirs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  trainer:
    image: model-mp4:local
    build: *app-build
    profiles: ["train"]
    shm_size: "1gb"
    command: /app/scripts/train.sh
    environment: *app-env
    extra_hosts:
      - "download.openmmlab.com:163.181.254.181"
    volumes:
      - ./dataset:/dataset
      - ./models:/models
      - ./work_dirs:/work_dirs
      - torch_cache:/root/.cache/torch

volumes:
  redis_data:
  torch_cache:
